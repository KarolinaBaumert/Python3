version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: pass
  service_a:
    build: ./service_a
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq
  service_b_api:
    build: ./service_b
    container_name: service_b_api
    command: [ "uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8001" ]
    ports:
      - "8001:8001"
    depends_on:
      - rabbitmq
      - service_a
  service_b_worker:
    build: ./service_b
    command: [ "python", "-m", "app.worker" ]
    depends_on:
      - rabbitmq
      - service_a
    deploy:
      replicas: 1
